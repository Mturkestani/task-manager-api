name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: API tests
        run: npm run test:api

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Start server for the load test
        run: |
          npm start &
          npx wait-on http://localhost:3000/tasks

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: k6 smoke test
        uses: grafana/run-k6-action@v1
        with:
          path: k6/smoke.js
