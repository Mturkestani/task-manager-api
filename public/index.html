<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager</title>
  <style>
    /* ---------- Colours (change them here once, used everywhere) ---------- */
    :root {
      --bg: #f4f5fb;
      --card: #ffffff;
      --text: #1f2330;
      --muted: #7a8094;
      --border: #e3e6ef;
      --primary: #5b5bd6;
      --primary-hover: #4a4ac4;
      --error: #d64545;
      --error-bg: #fdecec;
    }

    /* ---------- Page ---------- */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 64px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* ---------- Card ---------- */
    .card {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(31, 35, 48, 0.08);
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      margin: 4px 0 24px;
      color: var(--muted);
    }

    /* ---------- Form ---------- */
    form {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(91, 91, 214, 0.15);
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: var(--primary-hover);
    }

    /* ---------- Error message ---------- */
    #error {
      margin: 12px 0 0;
      padding: 10px 14px;
      color: var(--error);
      background: var(--error-bg);
      border-radius: 8px;
      font-size: 14px;
    }

    #error:empty {
      display: none; /* hide the red box when there is no error */
    }

    /* ---------- Task list ---------- */
    #task-list {
      list-style: none;
      margin: 24px 0 0;
      padding: 0;
    }

    #task-list li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 4px;
      border-bottom: 1px solid var(--border);
    }

    #task-list li:last-child {
      border-bottom: none;
    }

    #task-list li::before {
      content: "";
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      border: 2px solid var(--primary);
      border-radius: 50%;
    }

    #task-list:empty::after {
      content: "No tasks yet — add your first one above.";
      display: block;
      padding: 24px 0 8px;
      text-align: center;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Task Manager</h1>
    <p class="subtitle">Keep track of what you need to do.</p>

    <form id="task-form">
      <input id="task-title" placeholder="What do you need to do?" autocomplete="off">
      <button id="add-task" type="submit">Add</button>
    </form>
    <p id="error" role="alert"></p>

    <ul id="task-list"></ul>
  </main>

  <script>
    const list = document.getElementById('task-list');
    const error = document.getElementById('error');

    async function loadTasks() {
      const res = await fetch('/tasks');
      const tasks = await res.json();
      list.innerHTML = '';
      for (const task of tasks) {
        const li = document.createElement('li');
        li.textContent = task.title;
        list.appendChild(li);
      }
    }

    document.getElementById('task-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('task-title');
      const res = await fetch('/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value })
      });
      if (!res.ok) {
        const body = await res.json();
        error.textContent = body.errors.join(', ');
        return;
      }
      error.textContent = '';
      input.value = '';
      loadTasks();
    });

    loadTasks();
  </script>
</body>
</html>
